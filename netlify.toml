# Netlify configuration for Next.js deployment

[build]
  command = "npx prisma generate && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # Use Node 20 (recommended)
  NODE_VERSION = "20"

# Environment variables will be set in Netlify dashboard
# Required variables:
# - DATABASE_URL (from Neon)
# - NEXTAUTH_SECRET
# - NEXTAUTH_URL (e.g., https://your-site.netlify.app)
# - RESEND_API_KEY
