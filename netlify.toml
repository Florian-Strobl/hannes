# Netlify configuration for Next.js deployment

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # Use Node 18 or higher
  NODE_VERSION = "18"

# Redirects and headers
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Environment variables will be set in Netlify dashboard
# Required variables:
# - DATABASE_URL (from Neon)
# - NEXTAUTH_SECRET
# - NEXTAUTH_URL (e.g., https://your-site.netlify.app)
# - RESEND_API_KEY
